<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1500" fill="none" viewBox="0 0 1840 1500">
  <!-- Fundo estilo Proton: blobs arredondados com blur forte. Cor da marca BlueSpark. -->
  <g clip-path="url(#clip)">
    <g filter="url(#blur-left)" opacity=".5">
      <rect width="664" height="878" x="-554" y="355" fill="#673DE6" rx="332"/>
    </g>
    <g filter="url(#blur-right)" opacity=".22">
      <rect width="725" height="662" x="1551" y="229" fill="#673DE6" rx="331"/>
    </g>
    <g filter="url(#blur-warm)" opacity=".18">
      <rect width="508" height="336" x="1760" y="568" fill="#A78BFA" rx="168"/>
    </g>
  </g>
  <defs>
    <filter id="blur-left" width="1132" height="1346" x="-788" y="121" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="117" result="effect1_foregroundBlur"/>
    </filter>
    <filter id="blur-right" width="1193" height="1130" x="1317" y="-5" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="117" result="effect1_foregroundBlur"/>
    </filter>
    <filter id="blur-warm" width="876" height="704" x="1576" y="384" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="92" result="effect1_foregroundBlur"/>
    </filter>
    <clipPath id="clip">
      <path fill="#fff" d="M0 0h1840v1500H0z"/>
    </clipPath>
  </defs>
</svg>
